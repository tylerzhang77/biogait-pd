[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biogait-pd"
version = "0.2.3"
description = "Interpretable kinematic modelling for cross-cohort gait-impairment rating prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tianyao Zhang" }
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "mujoco>=3.0",
  "interpret>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]
